name: BURTHA PR Labeler

# Auto-labels pull requests based on the files they touch.
# Labels are applied (never removed) whenever a PR is opened, re-opened, or
# its commits are updated.
#
# Label definitions live in .github/labeler.yml.
#
# Required permissions:
#   contents: read         — read changed file paths
#   pull-requests: write   — apply labels

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: burtha-pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply path-based labels
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false   # only add, never remove existing labels
